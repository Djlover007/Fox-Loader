<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fox Loader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen app shell. Header, scrolling main area, bottom navigation. Sheets slide up from the bottom. */
:root{
  --bg:#f7f5f2; --surface:#ffffff; --surface2:#efebe6; --fg:#17130f; --muted:#6f685f; --line:#e6e0d9;
  --accent:#e8640c; --accent-ink:#ffffff; --accent-soft:#fde6d4;
  --green:#14a37f; --green-soft:#d9f2ea; --brand:#111114; --good:#178a5a; --good-soft:#dcf3e6; --bad:#d0342c; --bad-soft:#fbe3e1;
  --shadow:rgba(40,24,10,.14);
  --font-display:'Bricolage Grotesque','Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c0c0f;--surface:#18181d;--surface2:#232329;--fg:#f4f4f6;--muted:#a4a4ae;--line:#2b2b32;
    --accent:#ff7a1a;--accent-ink:#1b0c02;--accent-soft:rgba(255,122,26,.16);
    --green:#2cc79c;--green-soft:rgba(44,199,156,.15);--good:#4cd08f;--good-soft:rgba(76,208,143,.14);--bad:#ff6f61;--bad-soft:rgba(255,111,97,.14);
    --shadow:rgba(0,0,0,.55);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c0c0f;--surface:#18181d;--surface2:#232329;--fg:#f4f4f6;--muted:#a4a4ae;--line:#2b2b32;
  --accent:#ff7a1a;--accent-ink:#1b0c02;--accent-soft:rgba(255,122,26,.16);
  --green:#2cc79c;--green-soft:rgba(44,199,156,.15);--good:#4cd08f;--good-soft:rgba(76,208,143,.14);--bad:#ff6f61;--bad-soft:rgba(255,111,97,.14);
  --shadow:rgba(0,0,0,.55);color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--fg);font:400 16px/1.45 var(--font-body);
  padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Kopf */
.head{display:flex;align-items:center;gap:10px;padding:12px 16px 6px;flex:none}
.logo{width:40px;height:40px;border-radius:12px;background:var(--brand);display:grid;place-items:center;flex:none}
.logo svg{width:30px;height:30px}
.brand{flex:1;min-width:0;display:flex;flex-direction:column}
.brand b{font:800 25px/1.05 var(--font-display);letter-spacing:-.02em}
.brand small{font-size:12px;color:var(--muted);letter-spacing:.04em;margin-top:2px}
.brand small span{color:var(--accent);font-weight:700}
.ib{width:44px;height:44px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--fg)}
.ib:active{background:var(--surface2)}

main{flex:1;min-height:0;overflow-y:auto;padding:6px 16px 24px;-webkit-overflow-scrolling:touch}
.view{display:flex;flex-direction:column;gap:14px;max-width:680px;margin:0 auto}
h2{font:700 22px/1.2 var(--font-display);margin:6px 0 0;letter-spacing:-.01em;text-wrap:balance}
.hint{color:var(--muted);font-size:14px;margin:0}
.lbl{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:0 0 6px}

/* Bausteine */
.box{background:var(--surface);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 0 var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:700;font-size:15px;background:var(--surface2);color:var(--fg);display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:46px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.grn{background:var(--green);color:#fff}
.btn.sm{min-height:38px;padding:7px 12px;font-size:14px;border-radius:12px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5}
.btn svg.i{width:18px;height:18px}
select,input[type=text],input[type=password],textarea{width:100%;border:0;border-radius:12px;background:var(--surface2);padding:12px 14px;color:var(--fg)}
select{height:46px;padding:0 12px;font-weight:600}
textarea{min-height:84px;resize:none;font-size:18px;line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{white-space:nowrap;flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip.add{border-style:dashed;color:var(--muted)}

.prog{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.empty{text-align:center;color:var(--muted);padding:28px 16px;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty svg{width:64px;height:64px}

/* Navigation unten */
.bnav{flex:none;display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.bnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:12px;font-weight:600;color:var(--muted)}
.bnav button .pill{width:56px;height:30px;border-radius:15px;display:grid;place-items:center}
.bnav button[aria-current="page"]{color:var(--fg)}
.bnav button[aria-current="page"] .pill{background:var(--accent-soft);color:var(--accent)}
.bnav .badge{position:absolute;margin:-16px 0 0 24px;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}

/* Blatt von unten */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:24px 24px 0 0;max-height:88%;overflow-y:auto;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .25s ease;display:flex;flex-direction:column;gap:12px}
.sheet.open{transform:none}
.sheet .grip{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center;margin-bottom:4px}
.sheet h3{font:700 21px/1.2 var(--font-display);margin:0}
.srow{background:var(--surface);border-radius:16px;padding:13px 14px;display:flex;flex-direction:column;gap:8px}
.srow.line{flex-direction:row;align-items:center;justify-content:space-between;gap:12px}
.srow small{color:var(--muted);font-size:13.5px}
.sw{appearance:none;width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw:checked{background:var(--green)}
.sw:checked::after{transform:translateX(20px)}
input[type=range]{width:100%;accent-color:var(--accent)}

.toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);padding:13px 16px;border-radius:14px;font-size:15px;box-shadow:0 8px 24px var(--shadow);opacity:0;transform:translateY(10px);transition:opacity .2s,transform .2s;pointer-events:none;max-width:560px;margin:0 auto}
.toast.on{opacity:1;transform:none}
.spin{display:inline-block;width:18px;height:18px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}

#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--bg);transition:opacity .45s ease,visibility 0s .45s}
#splash.hide{opacity:0;visibility:hidden}
#splash .sp-logo{width:104px;height:104px;border-radius:30px;display:grid;place-items:center;background:var(--brand);box-shadow:0 14px 34px var(--shadow);animation:spPop .6s cubic-bezier(.2,.9,.3,1.3) both}
#splash .sp-logo svg{width:74px;height:74px}
#splash b{font:800 32px/1.1 var(--font-display);letter-spacing:-.02em;margin-top:8px;animation:spUp .5s .15s ease both}
#splash small{font-size:14px;color:var(--muted);letter-spacing:.06em;animation:spUp .5s .3s ease both}
#splash small span{color:var(--accent);font-weight:700}
@keyframes spPop{from{transform:scale(.6);opacity:0}}
@keyframes spUp{from{transform:translateY(10px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Fox Loader */
.logo,#splash .sp-logo{box-shadow:inset 0 0 0 1px var(--line)}
.inrow{display:flex;gap:8px}
.inrow input{flex:1;min-width:0;font-size:16px}
.hero{background:var(--surface);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 0 var(--line)}
.hero h2{margin:0}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.how div{background:var(--surface);border-radius:14px;padding:10px 6px;text-align:center;font-size:12.5px;font-weight:600;color:var(--muted)}
.how b{display:block;font:800 18px/1.1 var(--font-display);color:var(--accent)}
.tw{display:flex;gap:10px;align-items:center}
.tw img{width:42px;height:42px;border-radius:50%;background:var(--surface2);flex:none;object-fit:cover}
.tw .tx{flex:1;min-width:0}
.tw .tx b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tw .tx small{color:var(--muted)}
.ttext{margin:0;font-size:15px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.med{background:var(--surface);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 1px 0 var(--line)}
.med .pv{position:relative;background:#000;aspect-ratio:16/9;display:grid;place-items:center}
.med .pv img{width:100%;height:100%;object-fit:contain}
.med .pv .tag{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.7);color:#fff;font-size:12.5px;font-weight:700;padding:4px 9px;border-radius:999px}
.med .pv .pl{position:absolute;width:54px;height:54px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;color:#fff}
.med .pv .pl svg{width:26px;height:26px;fill:#fff;stroke:none}
.med .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.ok{display:flex;gap:8px;align-items:center;color:var(--good);font-weight:700}
.err{background:var(--bad-soft);color:var(--bad);border-radius:16px;padding:12px 14px;font-size:14.5px}
.hist{background:var(--surface);border-radius:18px;padding:10px;display:flex;gap:12px;align-items:center}
.hist .th{width:76px;height:76px;border-radius:12px;background:var(--surface2) center/cover no-repeat;flex:none;display:grid;place-items:center;color:var(--muted)}
.hist .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.hist .tx b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist .tx small{color:var(--muted);font-size:13px}
.hist .acts{display:flex;gap:4px;margin-top:4px}
.plats{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.plats span{font-size:12px;font-weight:700;color:var(--muted);background:var(--surface2);border-radius:999px;padding:4px 10px}
.tw .pf{width:42px;height:42px;border-radius:50%;background:var(--surface2);flex:none;display:grid;place-items:center;font-size:10px;font-weight:800;color:var(--muted);text-align:center;line-height:1.1;overflow:hidden}
img.gone{visibility:hidden}
.med.aud .pv{aspect-ratio:3/1}
.med.aud .pv img{object-fit:cover;opacity:.55}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:0 -4px}
.tile{position:relative;border:0;padding:0;aspect-ratio:1;background:var(--surface2);border-radius:10px;overflow:hidden;outline-offset:-3px}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile.on{outline:3px solid var(--accent)}
.tile.on img{opacity:.75}
.tile .du{position:absolute;left:5px;bottom:5px;background:rgba(0,0,0,.7);color:#fff;font-size:11.5px;font-weight:700;padding:2px 6px;border-radius:999px}
.tile .ck{position:absolute;right:6px;top:6px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center}
.tile .ck svg.i{width:15px;height:15px;stroke-width:3}
.tile .st{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.45);color:#fff;font-weight:800;font-size:15px}
.tile .st svg.i{width:30px;height:30px;stroke-width:3}
.tile .st.ok2{background:rgba(23,138,90,.55)}
.tile .st.bad2{background:rgba(208,52,44,.6);font-size:24px}
.pbar{position:sticky;top:-6px;z-index:5;background:var(--bg);padding:8px 0;display:flex;gap:8px;align-items:center;justify-content:space-between}
.pbar .btn.pri{flex:1}
.med .pv{cursor:pointer}
.med .pv .pvh{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.7);color:#fff;font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px}
.tile{cursor:pointer}
.tile .ck{background:rgba(0,0,0,.35);border:2px solid #fff;width:26px;height:26px;right:5px;top:5px;z-index:2}
.tile .ck.on{background:var(--accent);border-color:var(--accent)}
.tile .ck::after{content:"";position:absolute;inset:-10px}
.pimg{min-height:180px;display:grid;place-items:center;background:#000;border-radius:16px;overflow:hidden}
.pimg img{width:100%;max-height:62vh;object-fit:contain;display:block}
.sheet input[type=text],.sheet input[type=tel],.sheet input[type=password]{width:100%;border:0;border-radius:12px;background:var(--surface2);padding:12px 14px;color:var(--fg);font-size:16px;box-sizing:border-box}
.tglist{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow:auto}
.tgrow{border:0;text-align:left;cursor:pointer}
.tile .st.lk{font-size:12px;background:rgba(0,0,0,.6)}
.qrbox{background:#fff;border-radius:16px;padding:10px;width:min(260px,70vw);margin:4px auto}
.qrbox svg{display:block;width:100%;height:auto}
.bnav{grid-template-columns:repeat(3,1fr)}
.plist{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:16px;padding:8px 10px;cursor:pointer}
.prow .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.prow .tx b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .tx small{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{position:relative;width:44px;height:44px;border-radius:50%;background:var(--surface2);flex:none;display:grid;place-items:center;font-weight:800;color:var(--muted);overflow:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ib.star.on{color:#e8a10c}
.ib.star.on svg{fill:#e8a10c}
#pfq{margin-bottom:2px}
</style>
</head>

    <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></symbol>

/* ================= Link erkennen ================= */
function findXId(t){
  t=String(t||'');
  var m=t.match(/(?:x|twitter|fxtwitter|vxtwitter|fixupx|fixvx|twittpr)\.com\/(?:[^\/\s?#]+\/status(?:es)?|i\/(?:web\/)?status)\/(\d{5,25})/i);
  if(m)return m[1];
  m=t.trim().match(/^(\d{8,25})$/);
  return m?m[1]:null;
}
function urlsIn(t){
  var u=(String(t||'').match(/https?:\/\/[^\s<>"'“”]+/gi)||[]).map(function(x){return x.replace(/[),.!?;:]+$/,'').replace(/^http:/i,'https:');});
  if(!u.length){var s=String(t||'').trim();if(/^(www\.)?[\w-]+(\.[\w-]+)+\/\S*$/i.test(s))u=['https://'+s];}
  return u;
}
function platOf(u){
  var h='';try{h=new URL(u).hostname.toLowerCase();}catch(e){return null;}
  h=h.replace(/^(www|m|mobile|web|vm|vt|music)\./,'');
  if(h==='t.co')return 'short';
  if(/(^|\.)(x|twitter|fxtwitter|vxtwitter|fixupx|fixvx)\.com$/.test(h))return 'x';
  if(/(^|\.)tiktok\.com$/.test(h))return 'tiktok';
  if(/(^|\.)(instagram\.com|instagr\.am|ddinstagram\.com)$/.test(h))return 'instagram';
  if(/(^|\.)(facebook\.com|fb\.watch|fb\.com)$/.test(h))return 'facebook';
  if(/(^|\.)(reddit\.com|redd\.it)$/.test(h))return 'reddit';
  if(/(^|\.)(youtube\.com|youtu\.be|youtube-nocookie\.com)$/.test(h))return 'youtube';
  if(/^(t\.me|telegram\.me|telegram\.dog)$/.test(h))return 'telegram';
  return 'web';
}
function detect(t){
  var id=findXId(t);if(id)return {p:'x',id:id};
  var pn=xProfileName(t);if(pn)return {p:'xprofile',name:pn};
  var ipn=igProfileName(t);if(ipn)return {p:'igprofile',name:ipn};
  var tpn=tgChannelName(t);if(tpn)return {p:'tgprofile',name:tpn};
  var us=urlsIn(t);
  for(var i=0;i<us.length;i++){var p=platOf(us[i]);if(p&&p!=='web'&&p!=='x')return {p:p,url:us[i]};}
  for(i=0;i<us.length;i++){if(platOf(us[i])==='web')return {p:'web',url:us[i]};}
  return null;
}

function qLabel(url,w,h){var m=String(url).match(/\/(\d{2,4})x(\d{2,4})\//);if(m){w=+m[1];h=+m[2];}return pLabel(w,h);}
function origPhoto(u){
  var m=String(u).match(/^(https:\/\/pbs\.twimg\.com\/media\/[^.?]+)\.(jpg|jpeg|png|webp)/i);
  if(m)return m[1]+'?format='+(m[2].toLowerCase()==='png'?'png':'jpg')+'&name=orig';
  return u;
}
function xVariants(list){
  var v=(list||[]).filter(function(x){return x&&x.url&&/mp4/i.test(x.content_type||x.type||'mp4')&&!/\.m3u8/i.test(x.url);})
    .map(function(x){return {url:x.url,bitrate:x.bitrate||0,label:qLabel(x.url)};});
  v=uniq(v,function(x){return x.url;});
  v.sort(function(a,b){return (b.bitrate||parseInt(b.label)||0)-(a.bitrate||parseInt(a.label)||0);});
  return v;
}
function xPhoto(u){return {kind:'image',thumb:u,variants:[{url:origPhoto(u),label:'Original',ext:/png/i.test(u)?'png':'jpg'}]};}
async function xSyndication(id){

    return (t&&t.mediaDetails||[]).map(function(m){
      if(m.type==='photo')return xPhoto(m.media_url_https);
      var vi=m.video_info||{};
      return {kind:'video',gif:m.type==='animated_gif',thumb:m.media_url_https,dur:(vi.duration_millis||0)/1000,variants:xVariants(vi.variants)};
    });
  }
  var media=med(j);if(!media.length&&j.quoted_tweet)media=med(j.quoted_tweet);
  var u=j.user||{};
  return {text:j.text||'',name:u.name||'',handle:u.screen_name||'',avatar:u.profile_image_url_https||'',media:media};
}
async function xFx(id){
  var j=await getJson('https://api.fxtwitter.com/status/'+id);

    return ((t&&t.media&&t.media.all)||[]).map(function(m){
      if(m.type==='photo')return xPhoto(m.url);
      var v=xVariants(m.variants);
      if(!v.length&&m.url)v=[{url:m.url,label:qLabel(m.url,m.width,m.height)}];
      return {kind:'video',gif:m.type==='gif',thumb:m.thumbnail_url||'',dur:m.duration||0,variants:v};
    });
  }
  var media=med(t);if(!media.length&&t.quote)media=med(t.quote);
  var a=t.author||{};
  return {text:t.text||'',name:a.name||'',handle:a.screen_name||'',avatar:a.avatar_url||'',media:media};
}
async function xVx(id){
  var j=await getJson('https://api.vxtwitter.com/Twitter/status/'+id);

    if(m.type==='image')return xPhoto(m.url);

}
async function getX(id){
  var r=await firstWithMedia([xSyndication,xFx,xVx],id,'Post nicht erreichbar. Er ist privat, gelöscht oder nur mit Anmeldung sichtbar.');
  r.id=id;r.link='https://x.com/'+(r.handle||'i')+'/status/'+id;

}
async function firstWithMedia(src,arg,msg){
  var best=null,errs=[];
  for(var i=0;i<src.length;i++){
    try{var r=await src[i](arg);r.media=(r.media||[]).filter(function(m){return m.variants&&m.variants.length;});if(r.media.length)return r;if(!best)best=r;}
    catch(e){errs.push(errText(e));}
  }
  if(best)return best;
  var e=errs.filter(function(x){return /^LOGIN:/.test(x);})[0];
  throw new Error(e||msg+(errs.length?' ('+errs[errs.length-1].slice(0,80)+')':''));
}

/* ================= TikTok ================= */
async function ttPage(url){
  var r=await get(url,{headers:{'Accept':'text/html,application/xhtml+xml'}});
  var fin=r.url,id=(fin.match(/\/(?:video|photo|v)\/(\d{8,25})/)||[])[1];
  var m=r.body.match(/<script[^>]+id="__UNIVERSAL_DATA_FOR_REHYDRATION__"[^>]*>([\s\S]*?)<\/script>/);
  if(!m)throw new Error('TikTok-Seite nicht lesbar');
  var j=JSON.parse(m[1]),sc=(j.__DEFAULT_SCOPE__||{})['webapp.video-detail'];
  var it=sc&&sc.itemInfo&&sc.itemInfo.itemStruct;
  if(!it)throw new Error(sc&&sc.statusMsg||'Video nicht gefunden');
  var hdr={'Referer':'https://www.tiktok.com/'};if(r.cookies)hdr.Cookie=r.cookies;
  var a=it.author||{},media=[],v=it.video||{};
  if(it.imagePost&&it.imagePost.images){
    it.imagePost.images.forEach(function(im){
      var l=(im.imageURL&&im.imageURL.urlList)||[];
      var u=l.filter(function(x){return /jpe?g/i.test(x);})[0]||l[0];
      if(u)media.push({kind:'image',thumb:u,headers:hdr,variants:[{url:u,label:'Original',ext:/\.webp/i.test(u)&&!/jpe?g/i.test(u)?'webp':'jpg'}]});
    });
  }else{
    var vs=(v.bitrateInfo||[]).map(function(b){
      var p=b.PlayAddr||{},u=(p.UrlList||[])[0];
      var hevc=/265|hev|bytevc1/i.test((b.CodecType||'')+(b.GearName||''));
      return {url:u,label:pLabel(p.Width,p.Height)+(hevc?' HEVC':''),bitrate:b.Bitrate||0,size:+p.DataSize||0,hevc:hevc,h:Math.min(+p.Width||0,+p.Height||0)};
    }).filter(function(x){return x.url;});
    vs=uniq(vs,function(x){return x.label;});
    vs.sort(function(x,y){return (y.h-x.h)||((x.hevc?1:0)-(y.hevc?1:0))||(y.bitrate-x.bitrate);});
    if(!vs.length&&v.playAddr)vs=[{url:v.playAddr,label:pLabel(v.width,v.height)||'Standard'}];
    if(vs.length)media.push({kind:'video',thumb:v.cover||v.originCover||'',dur:v.duration||0,headers:hdr,variants:vs});
  }
  var mu=it.music||{};
  if(mu.playUrl)media.push({kind:'audio',thumb:mu.coverLarge||mu.coverMedium||v.cover||'',dur:mu.duration||0,headers:hdr,variants:[{url:mu.playUrl,label:'Ton (MP3)',ext:'mp3'}],title:mu.title||''});
  return {id:it.id||id,text:it.desc||'',name:a.nickname||'',handle:a.uniqueId||'',avatar:a.avatarThumb||'',media:media,link:'https://www.tiktok.com/@'+(a.uniqueId||'')+'/video/'+(it.id||id)};
}
async function ttWm(url){
  var j=await getJson('https://www.tikwm.com/api/?hd=1&url='+encodeURIComponent(url));
  if(!j||j.code!==0||!j.data)throw new Error((j&&j.msg)||'TikWM kennt das Video nicht');
  var d=j.data,a=d.author||{},media=[];
  function fx(u){return !u?'':/^https?:/.test(u)?u:'https://www.tikwm.com'+u;}
  if(d.images&&d.images.length){
    d.images.forEach(function(u){media.push({kind:'image',thumb:fx(u),variants:[{url:fx(u),label:'Original',ext:'jpg'}]});});
  }else{
    var vs=[];
    if(d.hdplay)vs.push({url:fx(d.hdplay),label:'HD',size:d.hd_size||0});
    if(d.play)vs.push({url:fx(d.play),label:'Standard',size:d.size||0});
    vs=uniq(vs,function(x){return x.url;});
    if(vs.length)media.push({kind:'video',thumb:fx(d.cover||d.origin_cover),dur:d.duration||0,variants:vs});
  }
  if(d.music)media.push({kind:'audio',thumb:fx(d.music_info&&d.music_info.cover||d.cover),variants:[{url:fx(d.music),label:'Ton (MP3)',ext:'mp3'}]});
  return {id:d.id||'',text:d.title||'',name:a.nickname||'',handle:a.unique_id||'',avatar:fx(a.avatar),media:media,link:'https://www.tiktok.com/@'+(a.unique_id||'')+'/video/'+(d.id||'')};
}
async function getTikTok(url){
  return await firstWithMedia([ttPage,ttWm],url,'TikTok-Video nicht erreichbar. Ist es privat oder gelöscht?');

/* ================= Instagram ================= */
var IGH={'X-IG-App-ID':'936619743392459','X-ASBD-ID':'129477','X-Requested-With':'XMLHttpRequest','Referer':'https://www.instagram.com/','Accept':'*/*'};
var IGA='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
function igPk(code){var n=BigInt(0);code=code.slice(0,11);for(var i=0;i<code.length;i++){var k=IGA.indexOf(code[i]);if(k<0)return null;n=n*BigInt(64)+BigInt(k);}return n.toString();}
function igV1(it){
  var u=it.user||{},list=it.carousel_media&&it.carousel_media.length?it.carousel_media:[it];
  var media=list.map(function(m){
    var imgs=((m.image_versions2||{}).candidates||[]).slice().sort(function(a,b){return b.width*b.height-a.width*a.height;});
    var thumb=imgs.length?imgs[imgs.length>2?1:0].url:'';
    if(m.video_versions&&m.video_versions.length){
      var vs=m.video_versions.slice().sort(function(a,b){return (b.width*b.height)-(a.width*a.height);})
        .map(function(v){return {url:v.url,label:pLabel(v.width,v.height)||'Video'};});
      return {kind:'video',thumb:thumb,dur:m.video_duration||0,variants:uniq(uniq(vs,function(x){return x.url;}),function(x){return x.label;})};
    }
    return imgs.length?{kind:'image',thumb:thumb,variants:[{url:imgs[0].url,label:pLabel(imgs[0].width,imgs[0].height)||'Original',ext:'jpg'}]}:null;
  }).filter(Boolean);
  return {id:it.code||it.pk||'',text:(it.caption&&it.caption.text)||'',name:u.full_name||u.username||'',handle:u.username||'',avatar:u.profile_pic_url||'',media:media,link:it.code?'https://www.instagram.com/p/'+it.code+'/':''};
}
function igGql(m){
  var nodes=m.edge_sidecar_to_children?m.edge_sidecar_to_children.edges.map(function(e){return e.node;}):[m];
  var media=nodes.map(function(n){
    var d=n.dimensions||{},thumb=n.display_url;
    var res=(n.display_resources||[]).slice(-1)[0];
    if(n.is_video&&n.video_url)return {kind:'video',thumb:thumb,dur:n.video_duration||0,variants:[{url:n.video_url,label:pLabel(d.width,d.height)||'Video'}]};
    return {kind:'image',thumb:thumb,variants:[{url:(res&&res.src)||n.display_url,label:'Original',ext:'jpg'}]};
  });
  var o=m.owner||{},cap=(((m.edge_media_to_caption||{}).edges||[])[0]||{}).node;
  return {id:m.shortcode||'',text:(cap&&cap.text)||'',name:o.full_name||o.username||'',handle:o.username||'',avatar:o.profile_pic_url||'',media:media,link:'https://www.instagram.com/p/'+m.shortcode+'/'};
}
async function getInstagram(url){
  if(/instagram\.com\/share\//i.test(url)){var rr=await get(url,{cookies:true});url=rr.url;}
  var st=url.match(/instagram\.com\/stories\/([^\/?#]+)\/(\d+)/i);

  if(!st&&!cm){
    if(/instagram\.com\/stories\//i.test(url))throw new Error('Öffne die einzelne Story und teile genau die, dann klappt es.');
    throw new Error('Das ist kein Link zu einem Instagram-Beitrag, Reel oder einer Story.');
  }
  var pk=st?st[2]:igPk(cm[1]),code=cm?cm[1]:'';
  var src=[];
  async function v1(){
    if(!logins.instagram)throw new Error('LOGIN:instagram');
    var j=await igGet('https://www.instagram.com/api/v1/media/'+pk+'/info/');
    var it=j.items&&j.items[0];if(!it)throw new Error('nicht gefunden');
    return igV1(it);
  }
  async function gql(){
    if(!code)throw new Error('LOGIN:instagram');
    var vars=JSON.stringify({shortcode:code,fetch_tagged_user_count:null,hoisted_comment_id:null,hoisted_reply_id:null});
    var h=Object.assign({},IGH,{'Content-Type':'application/x-www-form-urlencoded','X-FB-LSD':'AVqbxe3J_YA','Origin':'https://www.instagram.com','Sec-Fetch-Site':'same-origin'});
    var j=await getJson('https://www.instagram.com/graphql/query',{method:'POST',headers:h,cookies:true,
      body:'av=0&__d=www&__user=0&__a=1&__req=3&lsd=AVqbxe3J_YA&variables='+encodeURIComponent(vars)+'&doc_id=8845758582119845'});
    var m=j&&j.data&&j.data.xdt_shortcode_media;
    if(!m)throw new Error(logins.instagram?'Beitrag nicht sichtbar (privat oder gelöscht)':'LOGIN:instagram');
    return igGql(m);
  }
  src=logins.instagram?[v1,gql]:[gql,v1];
  var r=await firstWithMedia(src,null,'Instagram-Beitrag nicht erreichbar.');
  if(!r.link)r.link=url;
  return r;

async function getFacebook(url){
  var r=await get(url,{cookies:true,headers:{'User-Agent':DESK,'Accept':'text/html,application/xhtml+xml','Sec-Fetch-Mode':'navigate','Sec-Fetch-Dest':'document'}});
  var b=r.body||'';

async function tgDownload(key,pid,name,kind,ext){

    if(tgCancel[pid])throw new Error('abgebrochen');

  },close:function(){}};
  try{

async function getWeb(url){
  var direct=url.match(/\.(mp4|m4v|mov|jpe?g|png|gif|webp|mp3|m4a)(\?|#|$)/i);
  function one(u,ext){
    ext=ext.toLowerCase().replace('jpeg','jpg').replace('m4v','mp4').replace('mov','mp4');
    var kind=/jpg|png|gif|webp/.test(ext)?'image':/mp3|m4a/.test(ext)?'audio':'video';
    return {kind:kind,thumb:kind==='image'?u:'',variants:[{url:u,label:'Original',ext:ext}]};
  }
  var host='';try{host=new URL(url).hostname.replace(/^www\./,'');}catch(e){}
  if(direct)return {id:String(Date.now()),text:decodeURIComponent(url.split('/').pop().split('?')[0]),name:host,handle:'',avatar:'',media:[one(url,direct[1])],link:url};
  var r=await get(url,{headers:{'Accept':'text/html,application/xhtml+xml'}});
  var t=(r.type||'').toLowerCase();
  if(/^video\/|^image\/|^audio\//.test(t)){var ex=t.split('/')[1].split(';')[0].replace('mpeg','mp3').replace('quicktime','mp4');return {id:String(Date.now()),text:'',name:host,handle:'',avatar:'',media:[one(r.url,ex)],link:url};}
  var b=r.body||'';
  function meta(p){var m=b.match(new RegExp('<meta[^>]+(?:property|name)=["\']'+p+'["\'][^>]+content=["\']([^"\']*)["\']','i'))||b.match(new RegExp('<meta[^>]+content=["\']([^"\']*)["\'][^>]+(?:property|name)=["\']'+p+'["\']','i'));return m?htmlDec(m[1]):'';}
  var found=[];
  ['og:video:secure_url','og:video:url','og:video','twitter:player:stream'].forEach(function(p){var v=meta(p);if(v)found.push(abs(v,r.url));});
  var re=/<(?:video|source)\b[^>]*\bsrc=["']([^"']+)["']/gi,x;
  while((x=re.exec(b)))found.push(abs(x[1],r.url));

async function lookup(text,fromShare){
  if(busy)return;
  text=String(text||'').trim();
  if(!text){toast('Füge zuerst einen Link ein.');return;}
  if(!fromShare||true)save('fl-last',{text:text});
  busy=true;lastErr='';needLogin='';if(igPr){igPr=null;L.grabStop().catch(function(){});}cur=null;go('load');
  try{
    var d=detect(text);
    if(!d)throw new Error('Das ist kein Link. Kopiere in der App „Link kopieren“ und füge ihn hier ein.');
    if(d.p==='short'){var rr=await get(d.url,{method:'HEAD'});d=detect(rr.url);if(!d)throw new Error('Der Kurzlink führt nirgendwo hin.');}
    if(d.p==='x'&&!d.id){var xi=findXId(d.url),xn=xProfileName(d.url);if(xn){d={p:'xprofile',name:xn};}else if(!xi)throw new Error('Das ist kein Link zu einem Post oder Profil auf X.');else d.id=xi;}
    if(d.p==='xprofile'||d.p==='igprofile'||d.p==='tgprofile'){
      cur=d.p==='xprofile'?await getXProfile(d.name):d.p==='igprofile'?await getIgProfile(d.name):await getTgProfile(d.name);busy=false;render();await xProfileMore();
      for(var tries=0;tries<(cur&&cur.p==='telegram'?4:1);tries++){if(cur&&cur.kind==='profile'&&profVisible(cur).length<9&&!cur.done&&!cur.err)await xProfileMore();}
      return;
    }
    var tw;
    if(d.p==='telegram'&&tgIsPriv(d.url)){
      if(!tgStore().session)throw new Error('LOGIN:telegram');
      var tr=await tgPrivate(d.url);
      if(tr.kind==='profile'){cur=tr;busy=false;render();await xProfileMore();for(var t3=0;t3<3;t3++){if(cur&&cur.kind==='profile'&&profVisible(cur).length<9&&!cur.done&&!cur.err)await xProfileMore();}return;}
      tw=tr;
    }else switch(d.p){
      case 'x':tw=await getX(d.id);break;
      case 'tiktok':tw=await getTikTok(d.url);break;
      case 'instagram':tw=await getInstagram(d.url);break;
      case 'facebook':tw=await getFacebook(d.url);break;
      case 'reddit':tw=await getReddit(d.url);break;
      case 'youtube':tw=await getYouTube(d.url);break;
      case 'telegram':tw=await getTelegram(d.url);break;
      default:tw=await getWeb(d.url);
    }
    tw.p=tw.p||(d.p==='reddit'&&tw.link&&/youtube/.test(tw.link)?'youtube':d.p);
    tw.id=String(tw.id||Date.now());
    cur={tw:tw,sel:{},dl:{}};
    tw.media.forEach(function(m,i){cur.sel[i]=pickQ(m.variants);});
    if(!tw.media.length)lastErr='In diesem Beitrag ist kein Video und kein Bild.';
  }catch(e){
    var m=errText(e);
    if(/^LOGIN:/.test(m)){needLogin=m.slice(6);lastErr='';}
    else if(e&&e.errorMessage)lastErr=tgErr(e);
    else lastErr=m;
  }
  busy=false;render();
  if(cur&&cur.tw.media.length&&fromShare&&set.shareDl){
    cur.tw.media.forEach(function(m,i){if(m.kind!=='audio')dl(i);});
  }
}
function pickQ(v){
  if(set.q==='best'||v.length<2)return 0;
  if(set.q==='small')return v.length-1;
  for(var i=0;i<v.length;i++){var p=parseInt(v[i].label);if(p&&p<=720)return i;}
  return Math.floor(v.length/2);
}
function folderOf(kind){return kind==='image'?'Pictures/Fox Loader':kind==='audio'?'Music/Fox Loader':'Movies/Fox Loader';}
async function dl(i){
  if(!cur||!L)return;
  var tw=cur.tw,m=tw.media[i],k=tw.id+'-'+i,v=m.variants[cur.sel[i]||0];
  var d=cur.dl[k];if(d&&d.state==='run')return;
  var kind=v.kind||m.kind;
  cur.dl[k]={state:'run',pct:0};renderLoad();
  var who=(tw.handle||tw.name||'').replace(/^[ur]\//,'').replace(/[^\w.-]+/g,'_').slice(0,30);
  var name=PLAT[tw.p]+'_'+(who?who+'_':'')+String(tw.id).slice(-19)+(tw.media.filter(function(x){return x.kind!=='audio';}).length>1&&m.kind!=='audio'?'_'+(i+1):'')+(v.label&&!/^(Original|Video|Standard|Ton)/.test(v.label)?'_'+v.label.replace(/\s+/g,''):'');
  try{
    var opt={id:k,url:v.url,name:name,kind:kind,ext:v.ext||(kind==='video'?'mp4':''),chunked:!!v.chunked};
    if(v.audio)opt.audio=v.audio;
    var h=v.headers||m.headers;if(h)opt.headers=h;
    if(v.cookies)opt.cookies=true;
    if(m.locked)throw new Error(TGLOCK);
    var r=v.tg?await tgDownload(v.tg,k,name,kind,v.ext||'mp4'):v.mp3?await toMp3(k,v,name,h):await L.download(opt);
    cur.dl[k]={state:'done',uri:r.uri,mime:r.mime,size:r.size,kind:kind};
    var th=await smallThumb(m.thumb,m.headers);
    hist.unshift({t:Date.now(),p:tw.p,uri:r.uri,mime:r.mime,size:r.size,thumb:th,kind:kind,q:v.label,name:tw.name,handle:tw.handle,text:tw.text,link:tw.link});
    saveHist();
    toast((kind==='image'?'Bild':kind==='audio'?'Ton':'Video')+' gespeichert: '+folderOf(kind));
  }catch(e){
    var msg=errText(e);
    if(msg==='storage'){cur.dl[k]=null;toast('Erlaube Fox Loader den Speicher und tippe nochmal auf Laden.',6000);}
    else if(msg==='abgebrochen'){cur.dl[k]=null;}
    else cur.dl[k]={state:'err',msg:(/403/.test(msg)&&tw.p==='youtube')?'YouTube hat den Download abgelehnt (403). Tippe oben nochmal auf „Laden“, dann holt Fox Loader eine frische Adresse.':msg};
  }
  renderLoad();
}

var thumbs={};
function thumbKey(u){return String(u||'');}
async function thumbData(u,h){
  if(!u)return '';
  if(/^data:/.test(u))return u;
  if(/^tgthumb:/.test(u))return await tgThumb(u.slice(8),false);
  if(thumbs[u])return thumbs[u];
  try{var o={url:u};if(h)o.headers=h;var r=await L.image(o);thumbs[u]=r.data;return r.data;}catch(e){return '';}
}
async function smallThumb(u,h){
  var d=await thumbData(u,h);if(!d)return '';
  try{
    return await new Promise(function(res){
      var im=new Image();im.onload=function(){var s=Math.min(1,160/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));c.getContext('2d').drawImage(im,0,0,c.width,c.height);try{res(c.toDataURL('image/jpeg',.7));}catch(e){res('');}};
      im.onerror=function(){res('');};im.src=d;
    });
  }catch(e){return '';}
}
function hydrate(){
  Array.prototype.forEach.call(document.querySelectorAll('img[data-src]'),function(im){
    var u=im.getAttribute('data-src');im.removeAttribute('data-src');
    var mi=im.getAttribute('data-m'),h=null;
    if(mi!=null&&cur&&cur.tw.media[+mi])h=cur.tw.media[+mi].headers;
    if(thumbs[u]){im.src=thumbs[u];return;}
    thumbData(u,h).then(function(d){if(d)im.src=d;else im.classList.add('gone');});
  });
}

var lameLoading=null;
function lameLib(){
  if(window.FoxLame)return Promise.resolve();
  if(lameLoading)return lameLoading;
  lameLoading=new Promise(function(ok,no){var s=document.createElement('script');s.src='lame.js';s.onload=function(){ok();};s.onerror=function(){lameLoading=null;no(new Error('MP3-Teil der App fehlt. Bitte App aktualisieren.'));};document.head.appendChild(s);});
  return lameLoading;
}
function u8b64(u){var s='',CH=0x8000;for(var i=0;i<u.length;i+=CH)s+=String.fromCharCode.apply(null,u.subarray(i,i+CH));return btoa(s);}
async function toMp3(k,v,name,headers){
  delete tgCancel[k];
  var opt={id:k,url:v.url,name:'fox',kind:'audio',ext:'m4a',chunked:!!v.chunked,toCache:true};
  if(headers)opt.headers=headers;
  var r=await L.download(opt);
  var opened=false;
  try{
    if(window.__foxProg)window.__foxProg({id:k,pct:0,got:0,phase:'mp3'});
    var ab=await (await fetch(Capacitor.convertFileSrc(r.path))).arrayBuffer();
    var ctx;try{ctx=new AudioContext({sampleRate:44100});}catch(e){ctx=new AudioContext();}
    var buf;try{buf=await ctx.decodeAudioData(ab);}catch(e){throw new Error('Ton ließ sich nicht umwandeln. Nimm stattdessen M4A.');}
    ab=null;try{ctx.close();}catch(e){}
    if(buf.duration>3*3600)throw new Error('Zu lang für MP3 auf dem Handy. Nimm M4A.');
    await lameLib();
    var ch=Math.min(2,buf.numberOfChannels),n=buf.length,l=buf.getChannelData(0),rr=ch>1?buf.getChannelData(1):null;
    var enc=new FoxLame.Mp3Encoder(ch,buf.sampleRate,192);
    await L.fileOpen({id:k,name:name,kind:'audio',ext:'mp3'});opened=true;
    var parts=[],pl=0,total=0,BL=1152*40,lastT=0;
    var li=new Int16Array(BL),ri=new Int16Array(BL);
    async function flush(){if(!pl)return;var all=new Uint8Array(pl),o=0;parts.forEach(function(p){all.set(p,o);o+=p.length;});parts=[];pl=0;await L.fileWrite({id:k,data:u8b64(all)});}
    function push(m){if(m&&m.length){var c=new Uint8Array(m.buffer,m.byteOffset,m.length).slice();parts.push(c);pl+=c.length;total+=c.length;}}
    for(var i=0;i<n;i+=BL){
      if(tgCancel[k])throw new Error('abgebrochen');
      var m=Math.min(BL,n-i);
      for(var j=0;j<m;j++){var a=l[i+j];a=a<-1?-1:a>1?1:a;li[j]=a<0?a*32768:a*32767;if(rr){var b2=rr[i+j];b2=b2<-1?-1:b2>1?1:b2;ri[j]=b2<0?b2*32768:b2*32767;}}
      push(rr?enc.encodeBuffer(li.subarray(0,m),ri.subarray(0,m)):enc.encodeBuffer(li.subarray(0,m)));
      if(pl>=786432)await flush();
      var now=Date.now();
      if(now-lastT>250){lastT=now;if(window.__foxProg)window.__foxProg({id:k,pct:Math.floor(i*100/n),got:total,phase:'mp3'});await new Promise(function(ok){setTimeout(ok,0);});}
    }
    push(enc.flush());await flush();
    var res=await L.fileClose({id:k});opened=false;
    return res;
  }catch(e){
    if(opened){try{await L.fileAbort({id:k});}catch(z){}}
    throw e;
  }finally{
    L.cacheDelete({path:r.path}).catch(function(){});
  }
}

    var j=await r.json(),m=String(j.tag_name||'').match(/(\d+)\s*$/),ver=m?parseInt(m[1],10):0;
    var asset=(j.assets||[]).filter(function(a){return /\.apk$/i.test(a.name);})[0];

    if(appVer&&ver>appVer.code){

      updateSheet();
    }else if(manual)toast('Du hast die neueste Version ('+(appVer?appVer.code:'?')+').');

  var s=upd.size?' · '+mb(upd.size):'';
  openSheet('<h3>Neues Update bereit</h3><div class="srow"><b>Version '+upd.ver+'</b><small>Installiert: '+(appVer?appVer.code:'?')+s+'</small></div>'+
    '<div class="srow"><b>Was ist neu</b>'+(upd.notes.length?'<ul style="margin:0;padding-left:20px">'+upd.notes.slice(0,12).map(function(l){return '<li>'+esc(l)+'</li>';}).join('')+'</ul>':'<small>Kleine Verbesserungen und Fehlerbehebungen</small>')+'</div>'+
    '<button class="btn pri wide" data-act="updgo">Jetzt aktualisieren</button><button class="btn wide" data-act="close">Später</button>');
}
async function doUpdate(){
  var P=plug('Updater');if(!P||!upd)return;
  if(!UPL){UPL=true;
    try{P.addListener('progress',function(e){var a=$('#updP'),b=$('#updB'),p=(e&&e.percent)||0;if(a)a.textContent='Lade … '+p+' %';if(b)b.style.width=p+'%';});}catch(x){}
    try{P.addListener('installResult',function(e){var st=e&&e.status,m=String((e&&e.message)||'');if(st===0)return;if(st===3){toast('Installation abgebrochen.');return;}
      var t=(st===7||st===5||/INCOMPATIBLE|signature|CONFLICT/i.test(m))?'Die Signatur passt nicht zur installierten App. Deinstalliere Fox Loader einmal und installiere die neueste Version von GitHub von Hand.':st===6?'Auf dem Handy ist zu wenig Speicher frei.':'Android hat die Installation abgelehnt.';
      openSheet('<h3>Installation fehlgeschlagen</h3><div class="srow"><small style="color:var(--fg)">'+esc(t)+'</small><small>Technisch: '+esc(m.slice(0,160)||('Code '+st))+'</small></div><button class="btn wide" data-act="close">OK</button>');});}catch(x){}
  }
  try{
    if(!upd.done){
      openSheet('<h3>Update wird geladen</h3><div class="srow"><b id="updP">Lade … 0 %</b><div class="prog"><i id="updB" style="width:0"></i></div></div>');
      await P.download({url:upd.url});upd.done=true;
    }
    closeSheet();await P.install();
  }catch(e){var m=errText(e);closeSheet();
    if(/permission/i.test(m))toast('Erlaube Fox Loader in den Einstellungen „Apps installieren“ und tippe danach nochmal auf App-Update.',6000);
    else toast('Update fehlgeschlagen: '+m.slice(0,200),6000);}
}

/* ================= Eingaben ================= */
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&/^tg(id|hash|phone|code|pw)$/.test(e.target.id||'')){e.preventDefault();tgAct({tgid:'tgapi',tghash:'tgapi',tgphone:'tgphone',tgcode:'tgcode',tgpw:'tgpw'}[e.target.id]);return;}if(e.key==='Enter'&&e.target.id==='url'){e.preventDefault();e.target.blur();lookup(e.target.value);}});
document.addEventListener('click',async function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act, i=b.dataset.i!=null?+b.dataset.i:-1;
  switch(a){
    case 'settings':settingsSheet();break;
    case 'close':if(tgL.step==='busy'||tgL.qrLink){tgL.qrStop=true;}closeSheet();break;
    case 'tab-load':go('load');break;
    case 'go':{var u=$('#url');if(u)u.blur();lookup(u?u.value:'');break;}
    case 'paste':{
      var r={text:''};try{r=await L.clip();}catch(x){}
      if(!r.text){toast('Die Zwischenablage ist leer.');break;}
      var u2=$('#url');if(u2)u2.value=r.text.trim();
      if(detect(r.text))lookup(r.text);else toast('In der Zwischenablage ist kein Link.');
      break;}
    case 'clear':save('fl-last',null);if(igPr){igPr=null;L.grabStop().catch(function(){});}cur=null;lastErr='';needLogin='';var u3=$('#url');if(u3)u3.value='';renderLoad();break;
    case 'q':cur.sel[i]=+b.dataset.j;renderLoad();break;
    case 'dl':dl(i);break;
    case 'all':cur.tw.media.forEach(function(m,j){var d=cur.dl[cur.tw.id+'-'+j];if(m.kind!=='audio'&&(!d||d.state==='err'))dl(j);});break;
    case 'stop':tgCancel[b.dataset.k]=1;setTimeout(function(k2){delete tgCancel[k2];},5000,b.dataset.k);try{await L.cancel({id:b.dataset.k});}catch(x){}break;
    case 'play':L.play({uri:b.dataset.uri,mime:b.dataset.mime||'video/mp4'}).catch(function(){toast('Datei nicht gefunden. Wurde sie in der Galerie gelöscht?');});break;
    case 'share':L.share({uri:b.dataset.uri,mime:b.dataset.mime||'video/mp4'}).catch(function(err){toast(errText(err));});break;
    case 'post':L.openUrl({url:hist[i].link}).catch(function(){toast('Link lässt sich nicht öffnen.');});break;
    case 'login':{
      var site=b.dataset.k,wasErr=needLogin===site;closeSheet();
      if(site==='telegram'){tgLoginSheet();break;}
      try{var lr=await L.login({site:site});await refreshLogins();
        if(lr.ok){toast('Angemeldet bei '+(site==='facebook'?'Facebook':site==='x'?'X':'Instagram')+'.');if(wasErr){var u4=$('#url');lookup(u4?u4.value:'');}}
        else toast('Nicht angemeldet. Melde dich im Fenster an und tippe dann auf „Fertig“.',6000);
      }catch(x){toast(errText(x));}
      break;}
    case 'logout':{var s2=b.dataset.k;if(s2==='telegram'){await tgLogout();}else try{await L.logout({site:s2});}catch(x){}await refreshLogins();toast('Abgemeldet.');settingsSheet();break;}
    case 'del':openSheet('<h3>Download löschen?</h3><div class="srow"><small style="color:var(--fg)">Du kannst ihn nur aus der Liste nehmen oder auch die Datei auf dem Handy löschen.</small></div>'+
      '<button class="btn pri wide" data-act="delfile" data-i="'+i+'">'+ic('trash')+'Auch die Datei löschen</button><button class="btn wide" data-act="dellist" data-i="'+i+'">Nur aus der Liste</button><button class="btn wide" data-act="close">Abbrechen</button>');break;
    case 'delfile':closeSheet();try{await L.remove({uri:hist[i].uri});}catch(x){toast('Datei ließ sich nicht löschen, sie ist nur aus der Liste raus.');}hist.splice(i,1);saveHist();renderList();break;
    case 'dellist':closeSheet();hist.splice(i,1);saveHist();renderList();break;
    case 'clearhist':openSheet('<h3>Liste leeren?</h3><div class="srow"><small style="color:var(--fg)">Die Dateien bleiben auf deinem Handy.</small></div><button class="btn pri wide" data-act="clearyes">Ja, Liste leeren</button><button class="btn wide" data-act="close">Abbrechen</button>');break;
    case 'clearyes':closeSheet();hist=[];saveHist();renderList();break;
    case 'setq':set.q=b.dataset.k;saveSet();Array.prototype.forEach.call(b.parentNode.children,function(c){c.setAttribute('aria-pressed',String(c===b));});break;
    case 'tsel':{if(!cur||cur.kind!=='profile')break;var tk=b.dataset.tile,td=cur.dl[tk];
      if(cur.items.some(function(x){return x.key===tk&&x.locked;})){toast(TGLOCK,7000);break;}if(td&&(td.state==='done'||td.state==='run'||td.state==='wait'))break;
      if(cur.sel[tk])delete cur.sel[tk];else cur.sel[tk]=1;profTile(tk);profBar();break;}
    case 'tprev':{if(!cur||cur.kind!=='profile')break;var pk=b.dataset.tile,pd=cur.dl[pk];
      if(pd&&pd.state==='done'){L.play({uri:pd.uri,mime:pd.mime}).catch(function(){toast('Datei nicht gefunden.');});break;}
      var pit=cur.items.filter(function(x){return x.key===pk;})[0];if(!pit)break;
      var pr0=cur;
      function ptitle(x){return '@'+pr0.user.handle+(x.text?' · '+x.text.replace(/\s*https:\/\/t\.co\/\w+\s*$/,''):'');}
      if(pit.m.kind==='image'){previewMedia(pit.m,pit.m.variants[0],ptitle(pit),function(){if(cur===pr0)profQueue([pk],true);});break;}
      if(pit.m.variants[0].tg){pit.m.locked=pit.locked;tgPreview(pit.m,function(){if(cur===pr0)profQueue([pk],true);});break;}
      var vids=profVisible(pr0).filter(function(x){return x.m.kind==='video';});
      var st0=vids.indexOf(pit);
      previewList(vids.map(function(x){var dd=pr0.dl[x.key];return {m:x.m,v:x.m.variants[pickQ(x.m.variants)],title:ptitle(x),done:!!(dd&&dd.state!=='err'),onLoad:function(){if(cur===pr0)profQueue([x.key],true);}};}),Math.max(0,st0));
      break;}
    case 'pv':{if(!cur||!cur.tw)break;var pm=cur.tw.media[i];if(!pm)break;var pi=i,tw0=cur;
      var ttl=(cur.tw.name||PLAT[cur.tw.p]||'')+(cur.tw.text?' · '+cur.tw.text:'');
      if(pm.variants[0].tg){tgPreview(pm,function(){dl(pi);});break;}
      if(pm.kind==='image'){previewMedia(pm,pm.variants[cur.sel[i]||0],ttl,function(){dl(pi);});break;}
      var lst=[],st1=0;
      cur.tw.media.forEach(function(mm,j){if(mm.kind==='image')return;if(j===pi)st1=lst.length;var dd=tw0.dl[tw0.tw.id+'-'+j];
        lst.push({m:mm,v:mm.variants[tw0.sel[j]||0],title:ttl+(mm.kind==='audio'?' (nur Ton)':''),done:!!(dd&&dd.state!=='err'),onLoad:function(){if(cur===tw0)dl(j);}});});
      previewList(lst,st1);
      break;}
    case 'pvload':closeSheet();if(pvCb){var cb=pvCb;pvCb=null;cb();}break;
    case 'pall':{var nl=0;profVisible(cur).forEach(function(x){if(x.locked){nl++;return;}var d=cur.dl[x.key];if(!d||d.state==='err')cur.sel[x.key]=1;});if(nl)toast(nl+' gesperrte Videos ausgelassen. '+TGLOCK,7000);renderLoad();break;}
    case 'pnone':cur.sel={};renderLoad();break;
    case 'pdl':profQueue(Object.keys(cur.sel));break;
    case 'pstop':pq.forEach(function(k){cur.dl[k]=null;});pq=[];Object.keys(cur.dl).forEach(function(k){var d=cur.dl[k];if(d&&d.state==='run'){tgCancel[k]=1;L.cancel({id:k}).catch(function(){});}});renderLoad();break;
    case 'pmore':xProfileMore();break;
    case 'ponly':cur.only=b.dataset.k;renderLoad();break;
    case 'tgweb':L.openUrl({url:'https://my.telegram.org/apps'}).catch(function(){});break;
    case 'tgapi':case 'tgkey':case 'tgphone':case 'tgcode':case 'tgpw':tgAct(a);break;
    case 'tgchats':tgChats();break;
    case 'tgqr':tgQrLogin();break;
    case 'tgqrcancel':tgQrCancel();break;
    case 'tgqrapp':L.openUrl({url:tgL.qrLink}).catch(function(){toast('Telegram-App nicht gefunden. Scanne den Code mit einem zweiten Gerät.',6000);});break;
    case 'tgphoneway':tgL.qrStop=true;if(tgL.c){tgL.c.disconnect().catch(function(){});tgL.c=null;}tgSheet('phone');break;
    case 'tgopen':{var dd=tgDialogs[i];if(!dd)break;closeSheet();save('fl-last',{tg:String(dd.entity.id),title:dd.title||dd.name||''});if(igPr){igPr=null;L.grabStop().catch(function(){});}
      lastErr='';needLogin='';cur=tgProfileFor(dd.entity,dd.title||dd.name);go('load');await xProfileMore();
      for(var tt=0;tt<3;tt++){if(cur&&cur.kind==='profile'&&profVisible(cur).length<9&&!cur.done&&!cur.err)await xProfileMore();}
      break;}
    case 'fav':if(cur&&cur.kind==='profile'){toggleFav(cur);b.classList.toggle('on',isFav(cur));}break;
    case 'popen':{var pl=pfList(b.dataset.l),px=pl[i];if(px){go('load');openRef(px);}break;}
    case 'pdel':{e.stopPropagation();var dl0=b.dataset.l==='fav'?favs:recent;dl0.splice(i,1);save(b.dataset.l==='fav'?'fl-favs':'fl-recent',dl0);renderProfiles();break;}
    case 'pfload':pfLoad(b.dataset.k);break;
    case 'upd':closeSheet();checkUpdate(true);break;
    case 'updgo':doUpdate();break;
  }
});

/* ================= Start ================= */
function takeShared(t){
  if(!t)return;
  if(!detect(t)){toast('Im Geteilten ist kein Link.');return;}
  lastClip=t.trim();save('fl-clip',lastClip);
  render();var u=$('#url');if(u)u.value=t.trim();
  lookup(t,true);
}
async function checkClip(){
  if(!L||!set.autoClip||busy)return;
  try{
    var r=await L.clip(),t=String(r.text||'').trim();
    if(!t||t===lastClip)return;
    var d=detect(t);if(!d||d.p==='web')return;
    lastClip=t;save('fl-clip',lastClip);
    go('load');var u=$('#url');if(u)u.value=t;
    toast('Kopierter Link erkannt.');
    lookup(t);
  }catch(e){}
}
(function(){var t0=load('fl-tab','load');if(t0==='prof'||t0==='list'||t0==='load')tab=t0;Array.prototype.forEach.call(document.querySelectorAll('.bnav button'),function(b){if(b.dataset.tab===tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});})();
render();
function restoreLast(){
  var l=load('fl-last',null);if(!l)return;
  if(l.tg){if(tab==='load')tgOpenById(l.tg,l.title);else tgLater=l;return;}
  if(l.text){var u=$('#url');if(u)u.value=l.text;if(tab==='load')lookup(l.text);else lastLater=l.text;}
}
var lastLater=null,tgLater=null;
setTimeout(function(){$('#splash').classList.add('hide');},900);
if(L){
  refreshLogins();
  try{L.addListener('shared',function(e){takeShared(e&&e.text);});}catch(x){}
  L.getShared().then(function(r){if(r&&r.text)takeShared(r.text);else{restoreLast();setTimeout(checkClip,1500);}}).catch(function(){restoreLast();});
  document.addEventListener('visibilitychange',function(){if(!document.hidden)setTimeout(checkClip,400);});
}
if(isNative()&&set.autoUpd){
  var lastU=0;try{lastU=Number(localStorage.getItem('fl-upd-t')||0);}catch(e){}
  if(Date.now()-lastU>6*3600e3){try{localStorage.setItem('fl-upd-t',String(Date.now()));}catch(e){}setTimeout(function(){checkUpdate(false);},3000);}
}
